# Build the Vite app and deploy dist/ to GitHub Pages.
# NOTE: GitHub only runs workflows from <repo-root>/.github/workflows/.
# This file works as-is when poc/mile-field-mobile/ IS the repository root.
# If this folder is pushed as a subfolder, move this file to <repo-root>/.github/workflows/
# and set APP_DIR below to the subfolder path (e.g. poc/mile-field-mobile).
name: Deploy Mile Field mockup to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  APP_DIR: "."

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm ci || npm install
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
